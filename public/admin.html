<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admina — Office Wordle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display: flex; align-items: flex-start; justify-content: center; padding: 48px 20px; min-height: 100vh; }
    .admin-wrap { max-width: 760px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
    .admin-card {
      background: var(--surface);
      border: 1px solid var(--muted);
      border-radius: 16px;
      padding: 28px 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .admin-card h1 { font-size: 22px; letter-spacing: 1px; }
    .admin-card h1 span { color: var(--accent); }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-size: 12px; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; }
    .form-group input[type="password"],
    .form-group input[type="text"] {
      background: var(--surface-alt);
      border: 1px solid var(--muted);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--accent); }
    .error-msg { color: var(--danger); font-size: 13px; min-height: 18px; }
    .success-msg { color: var(--accent); font-size: 13px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; min-height: 18px; }
    #section-logged { display: none; flex-direction: column; gap: 20px; }
    a.back-link { color: var(--text-muted); font-size: 13px; text-decoration: none; }
    a.back-link:hover { color: var(--text-primary); }

    .season-summary {
      display: flex; gap: 20px; flex-wrap: wrap;
      font-size: 13px; color: var(--text-muted);
      padding: 12px 14px; background: var(--surface-alt); border-radius: 10px;
    }
    .season-summary b { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

    .word-form {
      display: grid;
      grid-template-columns: 70px 1fr 1.4fr auto;
      gap: 8px;
      align-items: end;
    }
    .word-form .form-group { gap: 4px; }
    .word-form input[type="text"], .word-form input[type="number"] {
      background: var(--surface-alt); border: 1px solid var(--muted); border-radius: 6px;
      color: var(--text-primary); font-size: 14px; padding: 8px 10px; outline: none; width: 100%;
    }
    .word-form input:focus { border-color: var(--accent); }
    @media (max-width: 620px) { .word-form { grid-template-columns: 1fr 1fr; } }

    table.words-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .words-table th {
      text-align: left; color: var(--text-muted); font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.5px; padding: 6px 8px; border-bottom: 1px solid var(--muted);
    }
    .words-table td { padding: 8px; border-bottom: 1px solid var(--muted); }
    .words-table tr.current td { background: rgba(200,241,53,0.06); }
    .words-table tr.past td { opacity: 0.6; }
    .word-cell { font-family: 'JetBrains Mono', monospace; font-weight: 600; letter-spacing: 1px; }
    .tag { font-size: 10px; padding: 2px 6px; border-radius: 8px; margin-left: 6px; }
    .tag.now { background: rgba(200,241,53,0.12); color: var(--accent); border: 1px solid rgba(200,241,53,0.3); }
    .tag.done { background: rgba(245,200,66,0.1); color: var(--gold); }
    .row-actions { display: flex; gap: 6px; }
    .btn-small {
      background: var(--surface-alt); border: 1px solid var(--muted); color: var(--text-primary);
      border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; white-space: nowrap;
      font-family: 'Space Grotesk', sans-serif; font-weight: 600;
    }
    .btn-small:hover { border-color: var(--accent); }
    .btn-small.danger { color: var(--danger); }
    .btn-small.danger:hover { border-color: var(--danger); }
    .payout-item { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 8px; background: var(--surface-alt); border-radius: 6px; margin-bottom: 4px; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <div class="admin-card">
      <h1>PANEL <span>ADMINA</span> · OFFICE WORDLE</h1>

      <div id="section-login">
        <div class="form-group">
          <label>Hasło</label>
          <input type="password" id="admin-password" placeholder="hasło" autocomplete="current-password" />
        </div>
        <button class="btn-primary" id="btn-admin-login" style="width:100%;margin-top:8px">Wejdź</button>
        <div class="error-msg" id="login-err"></div>
      </div>

      <div id="section-logged">
        <div class="success-msg" id="global-success"></div>
        <div class="error-msg" id="global-err"></div>
        <div class="season-summary" id="season-summary"></div>
        <a href="/" class="back-link">← Wróć do gry</a>
      </div>
    </div>

    <!-- HASŁA -->
    <div class="admin-card" id="section-words" style="display:none">
      <h3 style="font-size:13px;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase">DODAJ / EDYTUJ HASŁO</h3>
      <div class="word-form">
        <div class="form-group">
          <label>Dzień #</label>
          <input type="number" id="w-order" min="1" placeholder="1" />
        </div>
        <div class="form-group">
          <label>Hasło (A–Z)</label>
          <input type="text" id="w-word" placeholder="BIURO" maxlength="12" />
        </div>
        <div class="form-group">
          <label>Podpowiedź (hint)</label>
          <input type="text" id="w-hint" placeholder="np. Tu spędzasz 8h" maxlength="80" />
        </div>
        <button class="btn-primary" id="btn-save-word" style="padding:9px 16px">Zapisz</button>
      </div>
      <input type="hidden" id="w-id" />
      <div class="error-msg" id="word-err"></div>

      <h3 style="font-size:13px;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;margin-top:8px">LISTA HASEŁ</h3>
      <div style="overflow-x:auto">
        <table class="words-table">
          <thead>
            <tr><th>#</th><th>Hasło</th><th>Długość / próby</th><th>Podpowiedź</th><th>Gry</th><th></th></tr>
          </thead>
          <tbody id="words-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- GRACZE -->
    <div class="admin-card" id="section-players" style="display:none">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <h3 style="font-size:13px;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase">GRACZE</h3>
        <button class="btn-ghost" id="btn-load-players">Załaduj</button>
      </div>
      <div id="players-list"></div>
      <div class="error-msg" id="players-err"></div>
    </div>
  </div>

  <script>
    let adminPassword = '';
    let wordsData = [];

    document.getElementById('admin-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btn-admin-login').click();
    });

    document.getElementById('btn-admin-login').addEventListener('click', async () => {
      adminPassword = document.getElementById('admin-password').value;
      const errEl = document.getElementById('login-err');
      errEl.textContent = '';
      try {
        await loadWords();
        document.getElementById('section-login').style.display = 'none';
        document.getElementById('section-logged').style.display = 'flex';
        document.getElementById('section-words').style.display = 'flex';
        document.getElementById('section-players').style.display = 'flex';
      } catch (e) {
        errEl.textContent = e.message;
      }
    });

    async function loadWords() {
      const r = await fetch(`/api/admin/words?password=${encodeURIComponent(adminPassword)}`);
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      wordsData = d.words;
      renderSeason(d.season, d.season_start);
      renderWords();
    }

    function renderSeason(s, start) {
      const el = document.getElementById('season-summary');
      el.innerHTML = `
        <span>Start sezonu: <b>${esc(start)}</b></span>
        <span>Dzień sezonu: <b>#${s.day_number}</b></span>
        <span>Haseł łącznie: <b>${s.total_words}</b></span>
        <span>Pozostało: <b>${s.remaining_words}</b></span>
        <span>${s.season_over ? '🏁 sezon zakończony' : (s.has_word_today ? '▶ hasło na dziś ustawione' : '⚠ brak hasła na dziś')}</span>
      `;
    }

    function renderWords() {
      const tbody = document.getElementById('words-tbody');
      if (!wordsData.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-muted">Brak haseł — dodaj pierwsze powyżej.</td></tr>';
        return;
      }
      tbody.innerHTML = wordsData.map(w => {
        const rowCls = w.is_current ? 'current' : (w.is_past ? 'past' : '');
        const tag = w.is_current ? '<span class="tag now">DZIŚ</span>' : (w.is_past ? '<span class="tag done">było</span>' : '');
        return `
          <tr class="${rowCls}">
            <td class="mono">${w.order_index}</td>
            <td class="word-cell">${esc(w.word)}${tag}</td>
            <td class="mono">${w.length} / ${w.max_attempts}</td>
            <td>${esc(w.hint || '')}</td>
            <td class="mono">${w.games_played}</td>
            <td>
              <div class="row-actions">
                <button class="btn-small" onclick='editWord(${w.id})'>Edytuj</button>
                <button class="btn-small danger" onclick='deleteWord(${w.id})' ${w.games_played > 0 ? 'disabled title="ma rozegrane gry"' : ''}>Usuń</button>
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    function editWord(id) {
      const w = wordsData.find(x => x.id === id);
      if (!w) return;
      document.getElementById('w-id').value = w.id;
      document.getElementById('w-order').value = w.order_index;
      document.getElementById('w-word').value = w.word;
      document.getElementById('w-hint').value = w.hint || '';
      document.getElementById('w-word').focus();
    }

    document.getElementById('btn-save-word').addEventListener('click', async () => {
      const id = document.getElementById('w-id').value || null;
      const order_index = document.getElementById('w-order').value;
      const word = document.getElementById('w-word').value;
      const hint = document.getElementById('w-hint').value;
      const errEl = document.getElementById('word-err');
      const okEl = document.getElementById('global-success');
      errEl.textContent = '';
      try {
        const r = await fetch('/api/admin/word', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword, id, word, hint, order_index })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        okEl.textContent = `✓ Zapisano hasło (dzień #${order_index})`;
        document.getElementById('w-id').value = '';
        document.getElementById('w-order').value = '';
        document.getElementById('w-word').value = '';
        document.getElementById('w-hint').value = '';
        await loadWords();
      } catch (e) {
        errEl.textContent = e.message;
      }
    });

    async function deleteWord(id) {
      const w = wordsData.find(x => x.id === id);
      if (!confirm(`Usunąć hasło "${w ? w.word : ''}" (dzień #${w ? w.order_index : ''})?`)) return;
      const errEl = document.getElementById('word-err');
      errEl.textContent = '';
      try {
        const r = await fetch(`/api/admin/word/${id}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        await loadWords();
      } catch (e) {
        errEl.textContent = e.message;
      }
    }

    document.getElementById('btn-load-players').addEventListener('click', loadPlayers);

    async function loadPlayers() {
      const errEl = document.getElementById('players-err');
      errEl.textContent = '';
      try {
        const r = await fetch(`/api/admin/players?password=${encodeURIComponent(adminPassword)}`);
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        renderPlayers(d.players);
      } catch (e) {
        errEl.textContent = e.message;
      }
    }

    function renderPlayers(players) {
      const list = document.getElementById('players-list');
      if (!players.length) {
        list.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:8px 0">Brak graczy</div>';
        return;
      }
      list.innerHTML = players.map(p => `
        <div class="payout-item" id="player-row-${p.id}">
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.nickname)}</span>
          <span class="mono accent">${p.total_points} pkt</span>
          <span class="mono" style="color:var(--text-muted)">🔥${p.current_streak} · rekord ${p.best_streak}</span>
          <button class="btn-small danger" onclick="deletePlayer(${p.id}, '${esc(p.nickname)}')">usuń</button>
        </div>
      `).join('');
    }

    async function deletePlayer(id, nickname) {
      if (!confirm(`Usunąć gracza "${nickname}" wraz z historią gier?`)) return;
      const errEl = document.getElementById('players-err');
      errEl.textContent = '';
      try {
        const r = await fetch(`/api/admin/player/${id}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        const row = document.getElementById(`player-row-${id}`);
        if (row) row.remove();
      } catch (e) {
        errEl.textContent = e.message;
      }
    }

    function esc(str) {
      return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
